services:
  albumapi:
    container_name: albumapi
    image: albumapi:jdk21
    ports:
      - "8080:8080"
    env_file:
      - app.env
    environment:
      - SPRING_LOG_LEVEL=TRACE
    networks:
      - web        

  postgres:
    container_name: postgresql
    #image: registry.redhat.io/rhel9/postgresql-16
    image: postgresql:albumui
    ports:
      - "5432:5432"
    # env_file:
    #   - app.env
    environment:
      - POSTGRESQL_PASSWORD=album
      - POSTGRESQL_USER=album
      - POSTGRESQL_DATABASE=album
    networks:
      - web
networks:
  web: