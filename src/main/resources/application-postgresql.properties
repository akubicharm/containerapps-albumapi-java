# Switch Profiles
# ENVIRONMENT spring_profiles_active=postgresql
# or
# -Dspring-profiles.active=postgresql
# or
# mave profile option -Ppostgresql
# or comment out next line
#spring.profiles.active=postgresql

database=postgres
spring.datasource.url=jdbc:postgresql://localhost/album
spring.datasource.username=album
spring.datasource.password=album
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

logging.file.name=app.log